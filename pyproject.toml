[project]
name = "aml"
version = "0.1.0"
description = "Real-time anti-money-laundering detection with causal graph ML on IBM AML HI-Small"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "polars>=1.44,<1.45",
    "duckdb>=1.5,<1.6",
    "pyarrow>=20",
    "pandera[polars]>=0.26",
    "lightgbm>=4.7,<4.8",
    "optuna>=4.5",
    "scikit-learn>=1.7",
    "mlflow>=3.16.1,<3.17",
    "numpy>=2.2",
    "pyyaml>=6.0",
    "kaggle>=2.2.4",
    "scipy>=1.16",
]

[dependency-groups]
dev = [
    "modal==1.6.0",
    "pytest>=8.4",
    "hypothesis>=6.140",
    "ruff>=0.13",
    "pre-commit>=4.3",
]
serve = [
    "fastapi>=0.142,<0.143",
    "uvicorn>=0.37",
    "confluent-kafka>=2.15,<2.16",
    "jinja2>=3.1",
    "prometheus-client>=0.23",
]
# Non-default: a plain `uv sync` installs no torch. CI (Linux) syncs it with --all-groups.
gnn = [
    "torch==2.14.0; sys_platform == 'linux'",
    "torch_geometric==2.8.0.post1; sys_platform == 'linux'",
    "pyg_lib==0.9.0; sys_platform == 'linux'",
]

[tool.uv]
default-groups = ["dev", "serve"]
find-links = ["https://data.pyg.org/whl/torch-2.14.0+cu126.html"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "aml"
module-root = "src"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]

[tool.ruff.lint.isort]
known-first-party = ["aml", "modal_jobs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: slower end-to-end tests on the synthetic fixture",
]
